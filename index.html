<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Music Bingo</title>
<style>
:root{--bg:#fff7ee;--card:#fff;--ink:#2a1a3a;--mut:#7a6a8a;--ac:#e8368f;--ac2:#7b3fe4;--mark:#ffd23f;--bd:#e6d9f0;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#17101f;--card:#241a31;--ink:#f5eefc;--mut:#a898b8;--bd:#3a2c4b;--mark:#c9a100}}
:root[data-theme="dark"]{--bg:#17101f;--card:#241a31;--ink:#f5eefc;--mut:#a898b8;--bd:#3a2c4b;--mark:#c9a100}
*{box-sizing:border-box}html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,"Segoe UI",sans-serif}
main{max-width:640px;margin:0 auto;padding:14px}
h1{margin:4px 0 2px;font-size:1.6rem;background:linear-gradient(90deg,var(--ac),var(--ac2));-webkit-background-clip:text;background-clip:text;color:transparent}
.sub{color:var(--mut);font-size:.9rem;margin:0 0 10px}
.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.cell{aspect-ratio:1;border:2px solid var(--bd);background:var(--card);color:var(--ink);border-radius:10px;padding:4px;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;cursor:pointer;font:inherit;line-height:1.15;overflow:hidden}
.cell b{font-size:clamp(.62rem,2.7vw,.9rem)}.cell small{font-size:clamp(.5rem,2.1vw,.7rem);color:var(--mut);margin-top:2px}
.cell.m{background:var(--mark);border-color:var(--ac);color:#2a1a3a}.cell.m small{color:#5a4a1a}
.cell.w{outline:3px solid var(--ac2);box-shadow:0 0 0 3px var(--ac) inset}
.bar{display:flex;justify-content:space-between;align-items:center;margin:10px 0;gap:8px;flex-wrap:wrap}
.code{font:800 1.3rem system-ui,sans-serif;background:var(--card);border:2px dashed var(--bd);padding:6px 12px;border-radius:8px}
button.s{background:var(--card);color:var(--ink);border:2px solid var(--bd);border-radius:10px;padding:8px 12px;font-weight:600;cursor:pointer}
.win{display:none;background:linear-gradient(90deg,var(--ac),var(--ac2));color:#fff;border-radius:14px;padding:14px;text-align:center;font-weight:800;font-size:1.2rem;margin-bottom:10px}
.win.on{display:block}.win span{display:block;font-weight:500;font-size:.85rem;margin-top:4px}
.how{color:var(--mut);font-size:.82rem;margin-top:12px}
.hl{display:flex;flex-direction:column;gap:6px;margin:10px 0}
.row{display:flex;gap:8px;align-items:center;background:var(--card);border:2px solid var(--bd);border-radius:10px;padding:8px 10px;cursor:pointer;color:var(--ink);font:inherit;text-align:left;width:100%}
.row.p{opacity:.55;text-decoration:line-through}.row .n{min-width:26px;font-weight:800;color:var(--ac)}
input{padding:9px;border:2px solid var(--bd);border-radius:10px;background:var(--card);color:var(--ink);font:inherit;width:110px}
.ok{font-weight:700}
</style></head><body><main id="app"></main>
<script>
var S=["Wannabe|Spice Girls","...Baby One More Time|Britney Spears","I Want It That Way|Backstreet Boys","Hey Ya!|OutKast","Crazy in Love|Beyoncé","Smells Like Teen Spirit|Nirvana","Mr. Brightside|The Killers","Don't Stop Believin'|Journey","Livin' on a Prayer|Bon Jovi","Bohemian Rhapsody|Queen","Uptown Funk|Mark Ronson ft. Bruno Mars","Shake It Off|Taylor Swift","Rolling in the Deep|Adele","Lose Yourself|Eminem","Gangsta's Paradise|Coolio","Single Ladies|Beyoncé","Billie Jean|Michael Jackson","Girls Just Want to Have Fun|Cyndi Lauper","Take On Me|a-ha","Sweet Caroline|Neil Diamond","Dancing Queen|ABBA"];
var app=document.getElementById("app"),host=/[?&]host=1/.test(location.search);
function st(k,v){try{if(v===undefined){return JSON.parse(localStorage.getItem(k))}localStorage.setItem(k,JSON.stringify(v))}catch(e){return null}}
function rng(str){var h=2166136261;for(var i=0;i<str.length;i++){h^=str.charCodeAt(i);h=Math.imul(h,16777619)}return function(){h+=0x6D2B79F5;var t=h;t=Math.imul(t^t>>>15,t|1);t^=t+Math.imul(t^t>>>7,t|61);return((t^t>>>14)>>>0)/4294967296}}
function shuf(a,r){a=a.slice();for(var i=a.length-1;i>0;i--){var j=Math.floor(r()*(i+1)),t=a[i];a[i]=a[j];a[j]=t}return a}
function idx(){return S.map(function(_,i){return i})}
function card(n){return shuf(idx(),rng("card"+n)).slice(0,16)}
var L=[];for(var i=0;i<4;i++){L.push([0,1,2,3].map(function(c){return i*4+c}));L.push([0,1,2,3].map(function(r){return r*4+i}))}
L.push([0,5,10,15],[3,6,9,12]);
function wins(f){return L.filter(function(l){return l.every(function(i){return f(i)})})}
function gridHtml(cd,marked,wl){return '<div class="grid">'+cd.map(function(si,k){var p=S[si].split("|");return '<button class="cell '+(marked(k)?"m ":"")+(wl.indexOf(k)>-1?"w":"")+'" data-i="'+k+'"><b>'+p[0]+'</b><small>'+p[1]+'</small></button>'}).join("")+'</div>'}

function player(){
 var n=st("mb_card");if(!n){n=100+Math.floor(Math.random()*900);st("mb_card",n)}
 var cd=card(n),set={};(st("mb_marks")||[]).forEach(function(i){set[i]=1});
 var wl=[];wins(function(i){return set[i]}).forEach(function(l){wl=wl.concat(l)});
 app.innerHTML='<h1>🎵 Music Bingo</h1><p class="sub">Listen to each clip, then tap the matching song on your card. Get 4 in a row (across, down or diagonal) to win!</p>'+
 '<div class="win '+(wl.length?"on":"")+'">🎉 BINGO! 🎉<span>Post "BINGO" in Teams with your card number!</span></div>'+
 gridHtml(cd,function(k){return set[k]},wl)+
 '<div class="bar"><span>Your card: <span class="code">#'+n+'</span></span><button class="s" id="cl">Clear marks</button></div>'+
 '<p class="how">Your card is saved on this device, so you can refresh without losing it. Say your card number if you call BINGO.</p>';
 [].forEach.call(app.querySelectorAll(".cell"),function(b){b.onclick=function(){var i=+b.dataset.i;set[i]?delete set[i]:set[i]=1;st("mb_marks",Object.keys(set).map(Number));player()}});
 document.getElementById("cl").onclick=function(){st("mb_marks",[]);player()};
}

function hostView(){
 var order=st("mb_h_o");if(!order){order=shuf(idx(),Math.random);st("mb_h_o",order)}
 var pl=st("mb_h_p")||[];
 var h='<h1>🎤 Host Panel</h1><p class="sub">Send the clips in this order via Teams and tap each song once you have played it. A winner is very likely within 9 songs.</p>'+
 '<div class="bar"><b>Played: '+pl.length+' / '+S.length+'</b><span><button class="s" id="rs">New order</button> <button class="s" id="rp">Reset played</button></span></div><div class="hl">';
 order.forEach(function(si,k){var p=S[si].split("|");h+='<button class="row '+(pl.indexOf(si)>-1?"p":"")+'" data-s="'+si+'"><span class="n">'+(k+1)+'</span><span><b>'+p[0]+'</b> <small>'+p[1]+'</small></span></button>'});
 h+='</div><div class="bar"><span>Verify a card: <input id="vc" inputmode="numeric" placeholder="e.g. 427" maxlength="3"> <button class="s" id="vb">Check</button></span></div><div id="vr"></div>';
 app.innerHTML=h;
 [].forEach.call(app.querySelectorAll(".row"),function(b){b.onclick=function(){var s=+b.dataset.s,i=pl.indexOf(s);i>-1?pl.splice(i,1):pl.push(s);st("mb_h_p",pl);hostView()}});
 document.getElementById("rs").onclick=function(){st("mb_h_o",null);st("mb_h_p",[]);hostView()};
 document.getElementById("rp").onclick=function(){st("mb_h_p",[]);hostView()};
 document.getElementById("vb").onclick=function(){
  var n=document.getElementById("vc").value.trim().replace("#",""),o=document.getElementById("vr");
  if(!/^\d{3}$/.test(n)){o.innerHTML="<p>Enter a 3-digit card number.</p>";return}
  var cd=card(n),w=[];wins(function(i){return pl.indexOf(cd[i])>-1}).forEach(function(l){w=w.concat(l)});
  o.innerHTML='<p class="ok">'+(w.length?"✅ Valid BINGO":"❌ No line yet")+' — Card #'+n+' (highlighted = songs you have played)</p>'+gridHtml(cd,function(k){return pl.indexOf(cd[k])>-1},w);
 };
}
if(host)hostView();else player();
</script></body></html>
